server {
    listen 80;
    server_name localhost;
    
    # Подключаем стандартные MIME-типы (ОБЯЗАТЕЛЬНО!)
    include /etc/nginx/mime.types;
    
    # Дефолтный тип, если файл не распознан
    default_type application/octet-stream;

    # Корневая папка с файлами фронтенда
    root /usr/share/nginx/html;
    index index.html;

    # Добавляем типы для 3D моделей поверх стандартных
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
    }

    # 1. Раздача статики фронтенда
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. ПРОКСИ для API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Прокси для админки Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}